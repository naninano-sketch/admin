<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MobCash - تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-container">
    <h1>sonath dz MobCash</h1>
    <form id="login-form" autocomplete="off">
      <input type="text" id="username" placeholder="اسم المستخدم" required autofocus />
      <input type="password" id="password" placeholder="كلمة المرور" required />
      <button type="submit">دخول</button>
      <div class="error-message" id="error-message">اسم المستخدم أو كلمة المرور غير صحيحة.</div>
    </form>
    <a href="https://t.me/sonathdz" class="buy-button">شراء مفتاح الدخول</a>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-message');

    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      if(user === 'admin' && pass === 'admin') {
        // توجيه المستخدم للرابط المطلوب
        window.location.href = 'http://mafya-mafya.atwebpages.com/MAFYA-CRASH-HACK-FOR-SALE/TheLeaderDz/SPLASH.PHP';
      } else {
        errorMessage.style.display = 'block';
      }
    });

    // إخفاء رسالة الخطأ عند تعديل الحقول
    ['username', 'password'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        errorMessage.style.display = 'none';
      });
    });
  </script>
</body>
</html>
